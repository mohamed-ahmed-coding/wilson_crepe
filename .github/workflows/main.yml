
name: Wilson Crepe iOS Simulator Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Select iPhone Simulator
        shell: bash
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = [
              d for runtime, items in data["devices"].items()
              if "iOS" in runtime
              for d in items
              if d["isAvailable"] and d["name"].startswith("iPhone")
          ]
          if not devices:
              sys.exit("No available iPhone Simulator found")
          print(devices[0]["udid"])
          ')
          echo "SIMULATOR_UDID=$DEVICE_ID" >> "$GITHUB_ENV"
          echo "Selected simulator: $DEVICE_ID"

      - name: Boot iPhone Simulator
        run: |
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Build iOS Simulator app
        run: flutter build ios --simulator --debug --no-codesign

      - name: Read Bundle Identifier
        shell: bash
        run: |
          APP_PATH="build/ios/iphonesimulator/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Built app not found: $APP_PATH"
            exit 1
          fi

          BUNDLE_ID=$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleIdentifier' \
            "$APP_PATH/Info.plist")

          if [ -z "$BUNDLE_ID" ]; then
            echo "Bundle identifier not found"
            exit 1
          fi

          echo "IOS_BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "Bundle Identifier: $BUNDLE_ID"

      - name: Install app on Simulator
        run: |
          xcrun simctl install "$SIMULATOR_UDID" \
            build/ios/iphonesimulator/Runner.app

      - name: Launch Wilson Crepe
        run: |
          xcrun simctl launch "$SIMULATOR_UDID" "$IOS_BUNDLE_ID"
          sleep 15

      - name: Capture Simulator Screenshot
        if: always()
        run: |
          mkdir -p screenshots
          xcrun simctl io "$SIMULATOR_UDID" screenshot \
            screenshots/wilson-crepe-iphone.png

      - name: Upload Simulator Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wilson-crepe-ios-screenshot
          path: screenshots/wilson-crepe-iphone.png
          if-no-files-found: warn
          retention-days: 7
