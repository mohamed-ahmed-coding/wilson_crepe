
name: Wilson Crepe iOS Simulator Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Select an available iPhone Simulator
        shell: bash
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = [
              d for runtime, items in data["devices"].items()
              if "iOS" in runtime
              for d in items
              if d["isAvailable"] and d["name"].startswith("iPhone")
          ]
          if not devices:
              sys.exit("No available iPhone Simulator found")
          print(devices[0]["udid"])
          ')
          echo "SIMULATOR_UDID=$DEVICE_ID" >> "$GITHUB_ENV"
          echo "Selected simulator: $DEVICE_ID"

      - name: Boot iPhone Simulator
        run: |
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Build for iOS Simulator
        run: flutter build ios --simulator --debug --no-codesign

      - name: Capture initial Simulator Screenshot
        if: always()
        run: |
          mkdir -p screenshots
          if [ -n "${SIMULATOR_UDID:-}" ]; then
            xcrun simctl launch "$SIMULATOR_UDID" com.example.wilsonCrepe || true
            sleep 20
            xcrun simctl io "$SIMULATOR_UDID" screenshot \
              screenshots/wilson-crepe-initial.png || true
          fi

      - name: Run Flutter integration test
        run: |
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/app_screens_test.dart \
            -d "$SIMULATOR_UDID" \
            --no-pub

      - name: Collect test outputs
        if: always()
        run: |
          mkdir -p screenshots
          if [ -d build ]; then
            find build -type f \( -iname '*.png' -o -iname '*.jpg' \) \
              -exec cp -n {} screenshots/ \; || true
          fi

      - name: Upload screenshots and test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wilson-crepe-ios-test-results
          path: |
            screenshots/
            build/integration_response_data.json
          if-no-files-found: warn
          retention-days: 7
